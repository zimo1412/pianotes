<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="pianotes">
  <defs>
    <!-- 上深下浅的深色暖底，仿琴身漆面 -->
    <linearGradient id="bg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#161e26"/>
      <stop offset="100%" stop-color="#1f2a34"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- 三个米色「白键」色块（用窄缝分隔，不画线） -->
  <rect x="7.35" y="8.7" width="5.5" height="14.6" rx="0.7" fill="#efe2c4"/>
  <rect x="13.25" y="8.7" width="5.5" height="14.6" rx="0.7" fill="#efe2c4"/>
  <rect x="19.15" y="8.7" width="5.5" height="14.6" rx="0.7" fill="#efe2c4"/>

  <!-- 两个「黑键」：一颗墨黑、一颗暖红，做点睛 -->
  <rect x="11.75" y="8.7" width="2.6" height="8.6" rx="0.5" fill="#0e1620"/>
  <rect x="17.65" y="8.7" width="2.6" height="8.6" rx="0.5" fill="#c8503b"/>

  <!-- 右上角一颗琥珀小点：活泼装饰，不抢戏 -->
  <circle cx="25" cy="6.1" r="1.35" fill="#d4a23a"/>
</svg>
